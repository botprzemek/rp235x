<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Tablica Wyników - Sterowanie</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; text-align: center; margin: 0; padding: 30px; background: #0a0a0a; color: #00ffcc; }
        .scoreboard { background: #111; border: 4px solid #333; border-radius: 12px; padding: 20px; max-width: 800px; margin: 0 auto 30px auto; box-shadow: 0 0 20px rgba(0, 255, 204, 0.2); }
        .score-container { display: flex; justify-content: space-around; align-items: center; margin: 20px 0; }
        .team-box { flex: 1; }
        .team-label { font-size: 20px; color: #888; margin-bottom: 5px; letter-spacing: 2px; }
        .score-display { font-size: 80px; font-weight: bold; color: #ff0055; text-shadow: 0 0 10px rgba(255, 0, 85, 0.5); }
        .status-box { font-size: 24px; margin: 15px 0; color: #ffcc00; text-transform: uppercase; letter-spacing: 1px; }
        .controls { background: #1a1a1a; padding: 20px; border-radius: 8px; max-width: 800px; margin: 0 auto; display: flex; justify-content: space-around; }
        .team-controls { display: flex; flex-direction: column; gap: 8px; }
        button { padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 4px; background: #222; color: #fff; transition: 0.2s; }
        button:hover { background: #00ffcc; color: #000; box-shadow: 0 0 10px #00ffcc; }
        .main-controls { margin-top: 20px; }
        .btn-start { background: #00aa55; color: #fff; }
        .btn-stop { background: #aa0033; color: #fff; }
    </style>
</head>
<body>
    <div class="scoreboard">
        <h1>TABLICA WYNIKÓW</h1>
        <div class="status-box">Stan: <span id="state">Ładowanie...</span></div>
        <div class="score-container">
            <div class="team-box">
                <div class="team-label">DOM</div>
                <div class="score-display" id="home">0</div>
            </div>
            <div style="font-size: 40px; color: #444;">VS</div>
            <div class="team-box">
                <div class="team-label">GOŚCIE</div>
                <div class="score-display" id="away">0</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="team-controls">
            <div style="color: #ff0055; font-weight: bold;">DOM</div>
            <button onclick="sendScore('home', 1)">+1 PKT</button>
            <button onclick="sendScore('home', 2)">+2 PKT</button>
            <button onclick="sendScore('home', 3)">+3 PKT</button>
        </div>
        <div class="team-controls">
            <div style="color: #ff0055; font-weight: bold;">GOŚCIE</div>
            <button onclick="sendScore('away', 1)">+1 PKT</button>
            <button onclick="sendScore('away', 2)">+2 PKT</button>
            <button onclick="sendScore('away', 3)">+3 PKT</button>
        </div>
    </div>

    <div class="main-controls">
        <button id="toggle-btn" class="btn-start" onclick="toggleMatchState()">START</button>
    </div>

    <script>
        let currentState = 'Paused';
        const ws = new WebSocket('ws://' + window.location.host + '/ws');
        
        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            document.getElementById('home').innerText = data.home_score;
            document.getElementById('away').innerText = data.away_score;
            document.getElementById('state').innerText = data.state;
            
            currentState = data.state;
            updateToggleButton();
        };

        function updateToggleButton() {
            const btn = document.getElementById('toggle-btn');
            if (currentState === 'Running') {
                btn.innerText = 'STOP';
                btn.className = 'btn-stop';
            } else {
                btn.innerText = 'START';
                btn.className = 'btn-start';
            }
        }

        function toggleMatchState() {
            const action = currentState === 'Running' ? 'stop' : 'start';
            fetch('/api/' + action, { method: 'POST' });
        }

        function sendScore(team, points) {
            fetch('/api/score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ team: team, points: points })
            });
        }
    </script>
</body>
</html>
