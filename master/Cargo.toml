[package]
name = "master"
version.workspace = true
edition.workspace = true

[dependencies]
basketball = { workspace = true, features = ["serde"] }
config = { workspace = true, default-features = false }
net = { workspace = true, features = ["serde", "std"] }

bincode = { version = "1.3.3" }
bytes = { workspace = true }
futures = { workspace = true }
gloo-net = { workspace = true }
mime_guess = { workspace = true }
redb = { workspace = true }
reqwest = { version = "0.13.4", features = ["json"] }
rust-embed = { version = "8.12.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio-tungstenite = "0.30.0"
uuid = { workspace = true }
web-sys = { workspace = true }
yew = { version = "0.23.0", features = ["ssr"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
tracing-web = "0.1.3"
wasm-bindgen-futures = "0.4.78"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "signal"] }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }

[dev-dependencies]
yew = { version = "0.23.0" }
