[package]
name = "config"
version = "0.1.0"
edition = "2024"

[dependencies]
defmt = { version = "1.1.0", optional = true }
serde = { version = "1.0", default-features = false, optional = true }
serde_json = { version = "1.0.151", optional = true }

[dev-dependencies]
serde = { version = "1.0" }
serde_json = { version = "1.0.151" }
tempfile = { version = "3.27.0" }

[features]
default = [ "std" ]
std = [
    "dep:serde_json",
    "serde/std",
    "serde/derive"
]
defmt = [ "dep:defmt" ]