[package]
name = "config"
version = "0.1.0"
edition = "2024"

[dependencies]
# anyhow = { version = "1.0.104", optional = true }
defmt = { version = "1.1.0", optional = true }
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0.151", optional = true }

[dev-dependencies]
# anyhow = { version = "1.0.104" }
serde_json = { version = "1.0.151" }
tempfile = { version = "3.27.0" }

[features]
default = [ "std" ]
std = [
    # "dep:anyhow",
    "dep:serde_json",
    "serde/std",
    "serde/derive"
]
defmt = [ "dep:defmt" ]