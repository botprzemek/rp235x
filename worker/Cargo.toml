[package]
name = "worker"
version.workspace = true
edition.workspace = true

[[bin]]
name = "worker"
path = "src/main.rs"
test = false
doctest = false
bench = false

[dependencies]
basketball = { workspace = true, features = ["defmt"] }
config = { workspace = true, features = ["defmt"], default-features = false }
hub75 = { workspace = true, features = ["rp235x"] }
net = { workspace = true, features = ["defmt"] }

cortex-m = { workspace = true, features = ["inline-asm"] }
cortex-m-rt = { workspace = true }
critical-section = { version = "1.1", features = [] }
cyw43 = { version = "0.7.0", features = ["defmt", "firmware-logs"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }
defmt = { workspace = true }
defmt-rtt = { workspace = true }
embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-futures = { version = "0.1.2", features = [] }
embassy-net = { version = "=0.9.0", features = ["defmt", "tcp", "udp", "raw", "dhcpv4"] }
embassy-rp = { version = "0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa", "binary-info"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
heapless = "0.9.3"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = { version = "2.1", features = [] }
