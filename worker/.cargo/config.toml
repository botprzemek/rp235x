[unstable]
build-std = ["core"]
build-std-features = ["panic_immediate_abort"]

[build]
target = "thumbv8m.main-none-eabihf"

[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = ["bash", "-c", 'ssh orangepi-flasher "cat > /tmp/worker.elf && configurator flash /tmp/worker.elf && rm -f /tmp/worker.elf" < "$0"']
#runner = "probe-rs run --chip RP235x --speed 12000"
linker = "flip-link"

[env]
DEFMT_LOG = "debug" #,cyw43=off,embassy_net=off,smoltcp=off"