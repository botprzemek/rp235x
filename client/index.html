<!doctype html>
<html lang="en">
    <head>
        <style>
            button {
                background-color: #333;
                color: white;
                border: 1px solid #555;
                padding: 6px 12px;
                border-radius: 4px;
                cursor: pointer;
                font-weight: bold;
                transition: background 0.2s;
            }
            button:hover { background-color: #444; }
            button:active { background-color: #555; }
            .btn-blue { background-color: #0d47a1; border-color: #1565c0; }
            .btn-blue:hover { background-color: #1565c0; }
            .btn-red { background-color: #b71c1c; border-color: #c62828; }
            .btn-red:hover { background-color: #c62828; }
            .btn-action { background-color: #e65100; border-color: #ef6c00; flex: 1; padding: 8px; color: white; border-radius: 4px; font-weight: bold; cursor: pointer; }
            .btn-action:hover { background-color: #ef6c00; }
        </style>
    </head>
    <body></body>
</html>
