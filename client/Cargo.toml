[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3.34"
gloo-net = { version = "0.7.0", features = ["websocket"] }
gloo-timers = { version = "0.4.0", features = ["futures"] }
serde = { version = "1.0", features = ["derive"] }
wasm-bindgen = { version = "0.2" }
wasm-bindgen-futures = { version = "0.4" }
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "Window"] }
yew = { version = "0.23", features = ["csr"] }
